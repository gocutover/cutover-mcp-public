[project]
name = "cutover-mcp"
dynamic = ["version"]
description = "An MCP server for interacting with the Cutover API, powered by FastMCP."
authors = [{ name = "Cutover", email = "bot@cutover.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "mcp[cli]>=2.0.0",
    "typer[rich]>=0.27.0; extra == 'rich'",
    "fastmcp>=3.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=7.1.0",
    "pytest-watcher>=0.6.3",
    "respx>=0.23.1",
    "ruff>=0.16.0",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The git tag is the single source of truth for the version (see README, "Releases & versioning").
# release.yml tags every merge to main as `1.2.3`. The code reads the resulting package metadata
# via `cutover_mcp.__version__`.
source = "vcs"
# Used when git metadata is unavailable, e.g. a Docker build without the VERSION build arg.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# The repo history carries old `0.0.1-dev.N` prerelease tags, which setuptools-scm's default
# "guess next version" scheme refuses to bump. Report the nearest tag as-is; commits past it
# (or a dirty tree) get a local `+g<sha>[.d<date>]` suffix instead.
version_scheme = "only-version"

[project.scripts]
# The FastMCP CLI is the primary way to run the server
# cutover-mcp = "cutover_mcp.main:app"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cutover_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT003", "PT004"]

[tool.pytest-watcher]
now = false
clear = true
delay = 0.2
runner = "pytest"
patterns = ["*.py"]
ignore_patterns = []
